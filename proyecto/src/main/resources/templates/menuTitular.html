<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Titulares</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .header-sfc {
      width: 100vw;
      background: #fff;
      box-shadow: 0 2px 8px rgba(22,199,154,0.08);
      padding: 18px 0 18px 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 40px;
      padding-left: 40px;
    }
    .header-sfc img {
      height: 80px;
      width: auto;
    }
    .card-menu {
      background: #fff;
      padding: 32px 28px 32px 28px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(22,199,154,0.10);
      width: 100%;
      max-width: 410px;
      text-align: center;
      margin: 0 auto;
    }
    h2{
        color: #16c79a;
        margin-bottom: 28px;
        text-align: center;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .btn-menu {
      display: block;
      width: 100%;
      margin-bottom: 18px;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      border: none;
      border-radius: 30px;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
      box-shadow: 0 1px 4px rgba(22,199,154,0.08);
      background: #16c79a;
      color: #fff;
    }
    .btn-menu:hover {
      background: #13b088;
      color: #fff;
    }
  </style>
</head>
<body>
<div class="header-sfc">
  <img src="/logo-sfc.png" alt="Santa Fe Capital Logo">
</div>
<div class="container card-menu">
  <h2><b>Gestión de Titulares</b></h2>
  <div class="d-grid gap-3">
    <a href="/api/titulares/registroTitular" class="btn btn-menu">Registrar titular</a>
    <a href="/api/titulares/buscarTitulares" class="btn btn-menu">Buscar titulares</a>
  </div>
</div>
</body>
</html>
