<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registrar Licencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .header-sfc {
      width: 100vw;
      background: #fff;
      box-shadow: 0 2px 8px rgba(22,199,154,0.08);
      padding: 18px 0 18px 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 40px;
      padding-left: 40px;
    }
    .header-sfc img {
      height: 80px;
      width: auto;
    }
    .form-card {
      background: #fff;
      padding: 32px 28px 32px 28px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(22,199,154,0.10);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #16c79a;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }
    label {
      margin-bottom: 5px;
      font-weight: bold;
      color: #333;
    }
    label.required::after {
      content: '*';
      color: red;
      margin-left: 4px;
    }
    input[type="text"],
    input[type="date"],
    select,
    textarea {
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fdfdfd;
    }
    textarea {
      resize: none;
      height: 80px;
    }
    .input-error {
      border: 2px solid red !important;
    }
    .error-message {
      color: red;
      font-size: 13px;
      display: none;
      margin-top: 4px;
    }
    .btn-buscar, .btn-registrar {
      display: block;
      background-color: #16c79a;
      color: #fff;
      padding: 12px 24px;
      font-size: 15px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 0 auto;
      margin-top: 20px;
      transition: background 0.3s, color 0.3s, box-shadow 0.3s;
      box-shadow: 0 1px 4px rgba(22,199,154,0.08);
    }
    .btn-buscar:hover, .btn-registrar:hover {
      background-color: #13b088;
      color: #fff;
    }
    .readonly-box {
      padding: 1px 12px;
      font-size: 15px;
      background-color: #eef2f7;
      border: 1px solid #d3dce6;
      border-radius: 8px;
      color: #333;
      min-height: 40px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <div class="header-sfc">
    <img src="/logo-sfc.png" alt="Santa Fe Capital Logo">
  </div>
  <div class="form-card">
    <form id="formLicencia" onsubmit="registrarLicencia(event)" novalidate>
      <h2>Registro de Licencia</h2>
      <div class="form-group">
        <label for="tipoDocumento" class="required">Tipo de documento del titular</label>
        <select id="tipoDocumento" name="tipoDocumento" required>
          <option value="">Seleccione...</option>
          <th:block th:each="tipo : ${T(com.gestionlicencias.gestionlicenciasconducir.model.TipoDocumento).values()}">
            <option th:value="${tipo}" th:text="${tipo}"></option>
          </th:block>
        </select>
        <div class="error-message">Este campo es obligatorio.</div>
      </div>
      <div class="form-group">
        <label for="numeroDocumento" class="required">Número de documento del titular</label>
        <input type="text" id="numeroDocumento" name="numeroDocumento" maxlength="8" required>
        <div class="error-message">Este campo es obligatorio.</div>
      </div>
      <div style="text-align:right; margin-top: 25px; margin-bottom: 25px;">
        <button type="button" class="btn-buscar" onclick="buscarTitular()">Buscar titular</button>
      </div>
      <div class="form-group">
        <label for="claseLicencia" class="required">Clase de licencia</label>
        <select id="claseLicencia" name="claseLicencia" required disabled>
          <option value="">Seleccione...</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="E">E</option>
          <option value="G">G</option>
        </select>
        <div class="error-message">Este campo es obligatorio.</div>
      </div>
      <div class="form-group">
        <label for="limitaciones" style="display:inline; font-weight: bold; color: #333;">Observaciones <span style="color: #888;">(opcional)</span></label>
        <textarea id="limitaciones" name="limitaciones" maxlength="100" placeholder=""></textarea>
      </div>
      <button type="submit" class="btn-registrar" id="btnRegistrar" disabled>Registrar licencia</button>
    </form>
  </div>
<script>
  async function buscarTitular() {
    const tipoDoc = document.getElementById('tipoDocumento');
    const numeroDoc = document.getElementById('numeroDocumento');
    const claseLicencia = document.getElementById('claseLicencia');
    const limitaciones = document.getElementById('limitaciones');
    const btnRegistrar = document.getElementById('btnRegistrar');

    // Limpia errores visuales
    tipoDoc.classList.remove('input-error');
    numeroDoc.classList.remove('input-error');

    if (tipoDoc.value === "") {
      alert("Debe seleccionar un tipo de documento.");
      tipoDoc.classList.add('input-error');
      return;
    }

    const valorDoc = numeroDoc.value.trim();
    if (valorDoc === "") {
      alert("Debe ingresar un número de documento.");
      numeroDoc.classList.add('input-error');
      return;
    }

    if (tipoDoc.value === "DNI" && !/^\d{8}$/.test(valorDoc)) {
      alert("El DNI debe tener exactamente 8 dígitos.");
      numeroDoc.classList.add('input-error');
      return;
    } else if (tipoDoc.value !== "DNI" && !/^[a-zA-Z0-9]{8}$/.test(valorDoc)) {
      alert("El número debe tener 8 caracteres alfanuméricos.");
      numeroDoc.classList.add('input-error');
      return;
    }

    try {
      const response = await fetch(`/api/titulares/buscar/titular?tipoDocumento=${tipoDoc.value}&documento=${valorDoc}`)

      if (response.ok) {
        const titular = await response.json();

        // Habilita los campos
        claseLicencia.disabled = false;
        limitaciones.disabled = false;
        btnRegistrar.disabled = false;

        alert(`Titular encontrado: ${titular.nombre} ${titular.apellido}. Complete los demás campos.`);
      } else {
        claseLicencia.disabled = true;
        limitaciones.disabled = true;
        btnRegistrar.disabled = true;
        alert("Titular no encontrado. No puede registrar la licencia.");
      }
    } catch (error) {
      console.error("Error al buscar titular:", error);
      alert("Error al consultar el titular.");
    }
  }

  async function registrarLicencia(event) {
    event.preventDefault(); 

    const tipo = document.getElementById('tipoDocumento').value;
    const numero = document.getElementById('numeroDocumento').value.trim();
    const clase = document.getElementById('claseLicencia').value;
    const observaciones = document.getElementById('limitaciones').value;

    if (clase === "") {
      alert("Debe seleccionar una clase de licencia.");
      return;
    }

    if (!confirm("¿Está seguro de registrar la licencia?")) {
      return;
    }

    const licencia = {
      titular: {
        tipoDocumento: tipo,
        documento: numero
      },
      clase: clase,
      observaciones: observaciones
    };

    try {
      const response = await fetch('/api/licencias/registrar', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(licencia)
      });

      if (response.status === 201) {
        alert("Licencia registrada con éxito.");
        const url = new URL("/api/licencias/comprobante", window.location.origin);
        url.searchParams.append("tipoDocumento", tipo);
        url.searchParams.append("documento", numero);
        window.open(url.toString(), '_blank');

        const url2 = new URL("/api/licencias/imprimirLicencia", window.location.origin);
        url2.searchParams.append("tipoDocumento", tipo);
        url2.searchParams.append("documento", numero);
        window.open(url2.toString(), '_blank');

        location.reload();
      } else {
        const data = await response.json();
        alert("Error: " + (data.error || "No se pudo registrar la licencia."));
      }
    } catch (error) {
      console.error("Error al registrar:", error);
      alert("Error de red al registrar la licencia.");
    }
  }
</script>
</body>
</html>
