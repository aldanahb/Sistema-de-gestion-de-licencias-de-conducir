<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Modificar usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .form-card {
      background: #fff;
      padding: 32px 28px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(22,199,154,0.10);
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }
    h2 {
      color: #16c79a;
      margin-bottom: 28px;
      font-weight: 700;
      text-align: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }
    label {
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }
    input[type="text"],
    input[type="password"],
    select {
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fdfdfd;
    }
    input[disabled], select[disabled] {
      background-color: #e9ecef;
      cursor: not-allowed;
    }
    .input-error {
      border: 2px solid red !important;
    }
    .error-message {
      color: red;
      font-size: 13px;
      margin-top: 4px;
      display: none;
    }
    .success-message {
      color: green;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }
    .btn {
      display: block;
      margin: 30px auto 0;
      background-color: #16c79a;
      color: white;
      padding: 12px 24px;
      font-size: 15px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn:hover {
      background-color: #13b088;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Modificar usuario</h2>

    <form id="modificarUsuarioForm" novalidate>
      <div class="form-group">
        <label for="tipoDocumento">Tipo de documento</label>
        <select id="tipoDocumento" name="tipoDocumento" th:field="*{tipoDocumento}">
          <option th:each="tipo : ${tiposDocumento}" 
                  th:value="${tipo}" 
                  th:text="${tipo}"
                  th:selected="${tipo == usuario.tipoDocumento}">
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="documento">Número de documento</label>
        <input type="text" id="documento" name="documento" maxlength="8" disabled 
               th:value="${usuario.documento}" />
      </div>

      <div class="form-group">
        <label for="nombreUsuario">Nombre de usuario</label>
        <input type="text" id="nombreUsuario" name="nombreUsuario" maxlength="30" disabled 
               th:value="${usuario.nombreUsuario}" />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" maxlength="50" required
               th:value="${usuario.apellido}" />
        <div class="error-message" id="error-apellido">Este campo es obligatorio.</div>
      </div>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" maxlength="50" required
               th:value="${usuario.nombre}" />
        <div class="error-message" id="error-nombre">Este campo es obligatorio.</div>
      </div>

      <div class="form-group">
        <label for="contrasena">Contraseña nueva</label>
        <input type="password" id="contrasena" name="contrasena" minlength="6" />
        <div class="error-message" id="error-contrasena"></div>
      </div>

      <div class="form-group">
        <label for="contrasenaConfirm">Confirmar contraseña</label>
        <input type="password" id="contrasenaConfirm" name="contrasenaConfirm" minlength="6" />
        <div class="error-message" id="error-contrasenaConfirm"></div>
      </div>

      <button type="submit" class="btn">Guardar cambios</button>
      <div id="form-message" class="error-message" style="text-align:center; margin-top: 12px;"></div>
      <div id="form-success" class="success-message"></div>
    </form>
  </div>

<script>
  function mostrarError(campo, mensaje) {
    campo.classList.add('input-error');
    const errorDiv = document.getElementById('error-' + campo.id);
    if (errorDiv) {
      errorDiv.textContent = mensaje;
      errorDiv.style.display = 'block';
    }
  }
  function limpiarErrores() {
    document.querySelectorAll('.input-error').forEach(c => c.classList.remove('input-error'));
    document.querySelectorAll('.error-message').forEach(div => div.style.display = 'none');
    document.getElementById('form-message').textContent = '';
    document.getElementById('form-message').style.display = 'none';
    document.getElementById('form-success').textContent = '';
  }

  document.getElementById('modificarUsuarioForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    limpiarErrores();

    const apellido = document.getElementById('apellido');
    const nombre = document.getElementById('nombre');
    const contrasena = document.getElementById('contrasena');
    const contrasenaConfirm = document.getElementById('contrasenaConfirm');

    let valido = true;

    if (!apellido.value.trim()) {
      mostrarError(apellido, 'El apellido es obligatorio.');
      valido = false;
    }
    if (!nombre.value.trim()) {
      mostrarError(nombre, 'El nombre es obligatorio.');
      valido = false;
    }

    const regexTexto = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
    if (apellido.value.trim() && !regexTexto.test(apellido.value.trim())) {
      mostrarError(apellido, 'El apellido sólo puede contener letras y espacios.');
      valido = false;
    }
    if (nombre.value.trim() && !regexTexto.test(nombre.value.trim())) {
      mostrarError(nombre, 'El nombre sólo puede contener letras y espacios.');
      valido = false;
    }
    if (apellido.value.trim().length > 50) {
      mostrarError(apellido, 'El apellido no puede superar 50 caracteres.');
      valido = false;
    }
    if (nombre.value.trim().length > 50) {
      mostrarError(nombre, 'El nombre no puede superar 50 caracteres.');
      valido = false;
    }

    if (contrasena.value || contrasenaConfirm.value) {
      if (contrasena.value.length < 6) {
        mostrarError(contrasena, 'La contraseña debe tener al menos 6 caracteres.');
        valido = false;
      }
      if (contrasena.value !== contrasenaConfirm.value) {
        mostrarError(contrasenaConfirm, 'Las contraseñas no coinciden.');
        valido = false;
      }
      if (contrasena.value && !/^[A-Za-z0-9]+$/.test(contrasena.value)) {
        mostrarError(contrasena, 'La contraseña sólo puede contener letras y números.');
        valido = false;
      }
    }

    if (!valido) {
      alert('Por favor, complete todos los campos obligatorios correctamente.');
      return;
    }

    const data = {
      tipoDocumento: document.getElementById('tipoDocumento').value,
      documento: document.getElementById('documento').value,
      nombreUsuario: document.getElementById('nombreUsuario').value,
      apellido: apellido.value.trim(),
      nombre: nombre.value.trim(),
      contrasena: contrasena.value.trim() || null
    };

    try {
      const resp = await fetch('/api/usuarios/modificar', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });

      if (resp.ok) {
        document.getElementById('form-success').textContent = 'Usuario modificado correctamente.';
        alert('Usuario modificado correctamente.');
        setTimeout(() => window.location.href = '/api/usuarios/buscarUsuarios', 2000);
      } else {
        const errorData = await resp.json();
        document.getElementById('form-message').textContent = errorData.message || 'Error al modificar usuario.';
        alert(errorData.message || 'Error al modificar usuario.');
      }
    } catch (error) {
      document.getElementById('form-message').textContent = 'Error de conexión: ' + error.message;
      alert('Error de conexión: ' + error.message);
    }
  });
</script>

</body>
</html>
