<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Renovar Licencia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', 'Segoe UI', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }
    .header-sfc {
      width: 100vw;
      background: #fff;
      box-shadow: 0 2px 8px rgba(22,199,154,0.08);
      padding: 18px 0 18px 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 40px;
      padding-left: 40px;
    }
    .header-sfc img {
      height: 80px;
      width: auto;
    }
    .form-card {
      background: #fff;
      padding: 32px 28px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(22,199,154,0.10);
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    h2 {
      text-align: center;
      color: #16c79a;
      margin-bottom: 28px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }
    label {
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    input[readonly],
    select[disabled],
    textarea[readonly] {
      background-color: #eef2f7;
      border: 1px solid #d3dce6;
      color: #333;
      padding: 10px;
      border-radius: 8px;
    }
    .btn-renovar {
      display: block;
      background-color: #16c79a;
      color: #fff;
      padding: 12px 24px;
      font-size: 15px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      margin: 30px auto 0;
      transition: background 0.3s;
    }
    .btn-renovar:hover {
      background-color: #13b088;
    }
  </style>
</head>
<body>
  <div class="header-sfc">
    <img src="/logo-sfc.png" alt="Santa Fe Capital Logo">
  </div>

  <div class="form-card">
    <form id="formRenovarLicencia" onsubmit="renovarLicencia(event)">
      <h2>Renovación de Licencia</h2>

      <div class="form-group">
        <label>Nombre y apellido del titular</label>
        <input type="text" th:value="${titular.nombre + ' ' + titular.apellido}" readonly>
      </div>

      <div class="form-group">
        <label>Tipo de documento</label>
        <input type="text" name="tipoDocumento" th:value="${titular.tipoDocumento}" readonly>
      </div>

      <div class="form-group">
        <label>Número de documento</label>
        <input type="text" name="documento" th:value="${titular.documento}" readonly>
      </div>

      <div class="form-group">
        <label>Clase de licencia</label>
        <input type="text" name="claseLicencia" th:value="${licencia.clase}" readonly>
      </div>

      <div class="form-group">
        <label>Observaciones</label>
        <textarea readonly th:text="${licencia.observaciones}"></textarea>
      </div>

      <div class="form-group">
        <label>Motivo de renovación</label>
        <input type="text" th:value="${motivoRenovacion}" readonly>
      </div>

      <button type="submit" class="btn-renovar">Confirmar renovación</button>
    </form>
  </div>

  <script>
    async function renovarLicencia(event) {
      event.preventDefault();

      if (!confirm("¿Está seguro de renovar esta licencia?")) {
        return;
      }

      const tipoDocumento = document.querySelector('[name="tipoDocumento"]').value;
      const documento = document.querySelector('[name="documento"]').value;
      const claseLicencia = document.querySelector('[name="claseLicencia"]').value;

      try {
        const response = await fetch('/api/licencias/renovar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams({
            tipoDocumento,
            documento,
            claseLicencia
          })
        });

        if (response.ok) {
          const data = await response.json(); 
          const idTramite = data.idTramite;
          window.location.href = `/api/licencias/comprobanteCopia?idTramite=${idTramite}`;
        } else {
          const errorData = await response.json();
          alert("Error al renovar: " + (errorData.message || "Error desconocido."));
        }
      } catch (error) {
        alert("Error de red al intentar renovar.");
        console.error(error);
      }
    }
  </script>
</body>
</html>
