<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscar licencias vencidas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="header-sfc">
    <img src="/logo-sfc.png" alt="Santa Fe Capital Logo" />
  </div>

  <div class="form-card">
    <h2>Buscar licencias vencidas</h2>

    <form id="form-vencidas" onsubmit="buscarLicenciasVencidas(event)">
      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label for="dateFrom">Fecha desde</label>
          <input type="date" id="dateFrom" class="form-input form-control" name="dateFrom">
        </div>
        <div class="col-md-6 form-group">
          <label for="dateTo">Fecha hasta</label>
          <input type="date" id="dateTo" class="form-input form-control" name="dateTo">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6 form-group">
          <label for="classSelect">Clase de licencia</label>
          <select id="classSelect" class="form-select" name="classSelect" multiple>
            <option value="">Todos</option>
            <option value="A">Clase A</option>
            <option value="B">Clase B</option>
            <option value="C">Clase C</option>
            <option value="E">Clase E</option>
            <option value="G">Clase G</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn">Buscar</button>
    </form>

    <table class="results-table" id="tabla-vencidas" style="display:none;">
      <thead>
        <tr>
          <th>Nombre y apellido</th>
          <th>Documento</th>
          <th>Clase</th>
          <th>Estado</th>
          <th>Vencimiento</th>
        </tr>
      </thead>
      <tbody id="resultsTableBody"></tbody>
    </table>

    <div class="action-buttons">
      <button type="button" class="btn" onclick="renovarLicencia()">Renovar</button>
    </div>
  </div>

  <script src="/js/script.js" defer></script>
</body>
</html>
