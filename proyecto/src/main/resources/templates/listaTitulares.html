<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Buscar titulares</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0 20px;
    }
    .header-sfc {
      width: 100vw;
      background: #fff;
      box-shadow: 0 2px 8px rgba(22,199,154,0.08);
      padding: 18px 40px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
    }
    .header-sfc img {
      height: 80px;
    }
    .form-card {
      background: #fff;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 2px 16px rgba(22,199,154,0.10);
      margin: 0 auto 40px auto;
    }
    h2 {
      color: #16c79a;
      font-weight: 700;
      margin-bottom: 28px;
    }
    .form-group label {
      font-weight: bold;
      color: #333;
      margin-bottom: 5px;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #fdfdfd;
    }
    .btn {
      background-color: #16c79a;
      color: white;
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      font-size: 15px;
    }
    .btn:hover {
      background-color: #13b088;
    }
    table {
      width: 100%;
      margin-top: 30px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      word-break: break-word;
    }
    th {
      background-color: #e6f9f3;
      color: #16c79a;
    }
    tr.selected-row {
      background-color: #c7f0e6;
    }
    .action-buttons {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      justify-content: flex-end;
    }
  </style>
</head>
<body>
  <div class="header-sfc">
    <img src="/logo-sfc.png" alt="Santa Fe Capital Logo" />
  </div>

  <div class="form-card">
    <h2>Buscar titulares</h2>

    <form id="form-busqueda" onsubmit="buscarTitulares(event)">
      <div class="row mb-3">
        <div class="col-md-4 form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" name="apellido" placeholder="Buscar por apellido" />
        </div>
        <div class="col-md-4 form-group">
          <label for="tipoDocumento">Tipo de documento</label>
          <select id="tipoDocumento" name="tipoDocumento">
            <option value="">Todos</option>
            <th:block th:each="tipo : ${T(com.gestionlicencias.gestionlicenciasconducir.model.TipoDocumento).values()}">
                <option th:value="${tipo}" th:text="${tipo}"></option>
            </th:block>
         </select>
          <script>
            document.getElementById("tipoDocumento").value = ""; // Selecciona "Todos" por defecto
          </script> 
        </div>
        <div class="col-md-4 form-group">
          <label for="documento">Número de documento</label>
          <input type="text" id="documento" name="documento" placeholder="Buscar por número de documento" />
        </div>
      </div>
      <button type="submit" class="btn">Buscar</button>
    </form>

    <table id="tabla-titulares" style="display: none;">
      <thead>
        <tr>
          <th>Tipo Doc</th>
          <th>Documento</th>
          <th>Nombre</th>
          <th>Apellido</th>
          <th>Fecha nacimiento</th>
          <th>Dirección</th>
          <th>Grupo</th>
          <th>RH</th>
          <th>Donante</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div class="action-buttons" id="botones-acciones">
      <button class="btn" onclick="modificarTitular()">Modificar titular</button>
    </div>
  </div>

  <script>
    let titularSeleccionado = null;

    function formatearFecha(fechaIso) {
      const fecha = new Date(fechaIso);
      const dia = String(fecha.getDate()).padStart(2, '0');
      const mes = String(fecha.getMonth() + 1).padStart(2, '0');
      const anio = fecha.getFullYear();
      return `${dia}/${mes}/${anio}`;
    }

    async function buscarTitulares(event) {
      if (event) event.preventDefault();

      titularSeleccionado = null;

      const apellido = document.getElementById("apellido").value;
      const tipoDocumento = document.getElementById("tipoDocumento").value;
      const documento = document.getElementById("documento").value;

      const params = new URLSearchParams();
      if (apellido) params.append("apellido", apellido);
      if (tipoDocumento) params.append("tipoDocumento", tipoDocumento);
      if (documento) params.append("documento", documento);

      try {
        const response = await fetch(`/api/titulares/lista?${params.toString()}`);
        if (!response.ok) throw new Error("Error en la respuesta del servidor");

        const data = await response.json();
        const tbody = document.querySelector("#tabla-titulares tbody");
        const tabla = document.getElementById("tabla-titulares");
        tbody.innerHTML = "";

        if (data.length === 0) {
          tabla.style.display = "none";
          alert("No se encontraron titulares con esos criterios.");
          return;
        }

        tabla.style.display = "table";

        data.forEach(t => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${t.tipoDocumento}</td>
            <td>${t.documento}</td>
            <td>${t.nombre}</td>
            <td>${t.apellido}</td>
            <td>${formatearFecha(t.fechaNacimiento)}</td>
            <td>${t.direccion}</td>
            <td>${t.grupoSanguineo}</td>
            <td>${t.factorRH}</td>
            <td>${t.donanteOrganos ? "Sí" : "No"}</td>
          `;

          row.addEventListener("click", () => {
            document.querySelectorAll("#tabla-titulares tbody tr").forEach(tr => tr.classList.remove("selected-row"));
            row.classList.add("selected-row");
            titularSeleccionado = t;
          });

          tbody.appendChild(row);
        });

      } catch (error) {
        alert("Ocurrió un error al buscar titulares: " + error.message);
        console.error(error);
      }
    }

    function modificarTitular() {
      if (!titularSeleccionado) {
        alert("Por favor, seleccione un titular.");
        return;
      }

      const tipoDocumento = encodeURIComponent(titularSeleccionado.tipoDocumento);
      const documento = encodeURIComponent(titularSeleccionado.documento);
      window.location.href = `/api/titulares/modificar/${tipoDocumento}/${documento}`;
    }

    window.addEventListener("load", () => {
      buscarTitulares(); // carga inicial
    });
  </script>
</body>
</html>
